[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "polydyno"
version = "0.1.0"
description = "Polydyno — 50-turn PostgreSQL context drift benchmark (PolyScore, Eddy-Current load, tamper-evident workload)."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "Parrot Software" }]
keywords = ["benchmark", "llm", "postgresql", "context-drift", "invariants"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Testing",
]
dependencies = [
    "rich==15.0.0",
    "PyYAML==6.0.3",
    "pydantic==2.14.1",
    "anthropic==2.3.0",
    "openai==3.37.0",
    "python-dotenv==1.2.4",
    "sqlglot==30.24.0",
]

[project.scripts]
polydyno = "dyno_test:main"
polycracker = "dyno_test:main"

[project.urls]
Homepage = "https://polycracker.com"

[tool.setuptools]
include-package-data = true
py-modules = [
    "autopsy",
    "dyno_test",
    "providers",
    "telemetry",
    "validator",
    "workload",
]

[tool.setuptools.package-data]
"*" = ["schema.sql", "invariants.yaml"]
